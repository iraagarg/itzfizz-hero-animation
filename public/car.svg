<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" role="img" aria-label="Top view of a red sports car">
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a55"/>
      <stop offset="0.28" stop-color="#e8352b"/>
      <stop offset="0.72" stop-color="#c4221d"/>
      <stop offset="1" stop-color="#8e1216"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0473a"/>
      <stop offset="0.5" stop-color="#c9241f"/>
      <stop offset="1" stop-color="#9a1418"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.6" stop-color="#1c2733"/>
      <stop offset="1" stop-color="#2f4252"/>
    </linearGradient>
    <linearGradient id="glassRear" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#26343f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.7" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </radialGradient>
    <filter id="blur" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <rect x="22" y="22" width="404" height="162" rx="64" fill="#000" opacity="0.45" filter="url(#blur)"/>

  <!-- Tyres (drawn under the body so only the outer edge shows) -->
  <g fill="#0d0d0d">
    <rect x="82" y="14" width="64" height="24" rx="7"/>
    <rect x="82" y="162" width="64" height="24" rx="7"/>
    <rect x="300" y="16" width="62" height="22" rx="7"/>
    <rect x="300" y="162" width="62" height="22" rx="7"/>
  </g>
  <g fill="#3a3a3a">
    <rect x="90" y="15" width="48" height="4" rx="2"/>
    <rect x="90" y="181" width="48" height="4" rx="2"/>
    <rect x="308" y="17" width="46" height="4" rx="2"/>
    <rect x="308" y="179" width="46" height="4" rx="2"/>
  </g>

  <!-- Body -->
  <path fill="url(#paint)" d="
    M 26 100
    C 26 70, 28 52, 40 44
    C 60 30, 90 24, 115 24
    C 150 24, 170 34, 200 34
    L 280 34
    C 300 34, 310 26, 335 26
    C 370 26, 395 36, 408 54
    C 418 70, 421 86, 421 100
    C 421 114, 418 130, 408 146
    C 395 164, 370 174, 335 174
    C 310 174, 300 166, 280 166
    L 200 166
    C 170 166, 150 176, 115 176
    C 90 176, 60 170, 40 156
    C 28 148, 26 130, 26 100 Z"/>

  <!-- Body side sculpting -->
  <path d="M 150 40 C 200 44, 260 44, 300 38" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M 150 160 C 200 156, 260 156, 300 162" fill="none" stroke="#000" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Rear spoiler -->
  <rect x="32" y="38" width="16" height="124" rx="6" fill="#7d0f13"/>
  <rect x="35" y="42" width="4" height="116" rx="2" fill="#ff7a6b" opacity="0.55"/>

  <!-- Tail lights -->
  <path d="M 27 62 C 28 56, 30 52, 34 48 L 36 76 L 28 78 Z" fill="#ff2a2a"/>
  <path d="M 27 138 C 28 144, 30 148, 34 152 L 36 124 L 28 122 Z" fill="#ff2a2a"/>

  <!-- Engine cover vents -->
  <g stroke="#5a0b0e" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="70" y1="78" x2="130" y2="78"/>
    <line x1="70" y1="90" x2="136" y2="90"/>
    <line x1="70" y1="110" x2="136" y2="110"/>
    <line x1="70" y1="122" x2="130" y2="122"/>
  </g>

  <!-- Rear window -->
  <path fill="url(#glassRear)" d="M 178 58 C 160 68, 150 84, 150 100 C 150 116, 160 132, 178 142 L 186 132 C 178 122, 174 112, 174 100 C 174 88, 178 78, 186 68 Z"/>

  <!-- Side windows -->
  <path fill="#141c24" d="M 186 46 L 256 46 C 262 46, 266 48, 268 52 L 184 54 Z"/>
  <path fill="#141c24" d="M 186 154 L 256 154 C 262 154, 266 152, 268 148 L 184 146 Z"/>

  <!-- Roof -->
  <rect x="180" y="56" width="80" height="88" rx="20" fill="url(#roof)"/>
  <rect x="190" y="64" width="60" height="10" rx="5" fill="#fff" opacity="0.18"/>

  <!-- Windshield -->
  <path fill="url(#glass)" d="M 262 52 C 292 58, 308 76, 310 100 C 308 124, 292 142, 262 148 L 252 136 C 260 124, 263 112, 263 100 C 263 88, 260 76, 252 64 Z"/>
  <path d="M 272 64 C 290 72, 298 84, 300 94" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- Mirrors -->
  <ellipse cx="258" cy="31" rx="11" ry="6" fill="#9a1418"/>
  <ellipse cx="258" cy="169" rx="11" ry="6" fill="#9a1418"/>

  <!-- Hood lines and vents -->
  <path d="M 318 70 C 350 76, 380 82, 404 88" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="2.5"/>
  <path d="M 318 130 C 350 124, 380 118, 404 112" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="2.5"/>
  <rect x="340" y="92" width="34" height="6" rx="3" fill="#5a0b0e" opacity="0.8"/>
  <rect x="340" y="102" width="34" height="6" rx="3" fill="#5a0b0e" opacity="0.8"/>

  <!-- Headlights -->
  <path fill="url(#lamp)" d="M 388 44 C 400 50, 410 60, 415 72 L 406 72 C 401 62, 394 54, 384 49 Z"/>
  <path fill="url(#lamp)" d="M 388 156 C 400 150, 410 140, 415 128 L 406 128 C 401 138, 394 146, 384 151 Z"/>

  <!-- Front splitter -->
  <path d="M 418 80 C 421 90, 421 110, 418 120" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Gloss highlight along the upper flank -->
  <path d="M 60 40 C 120 30, 300 30, 380 40" fill="none" stroke="url(#shine)" stroke-width="6" stroke-linecap="round"/>
</svg>
